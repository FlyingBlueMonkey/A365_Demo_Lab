apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-chat-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-chat-agent
  template:
    metadata:
      labels:
        app: teams-chat-agent
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: YOUR_REGISTRY/teams-chat-agent:1.0
          ports:
            - name: http
              containerPort: 3978
          envFrom:
            - secretRef:
                name: teams-chat-agent-settings
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: teams-chat-agent
spec:
  selector:
    app: teams-chat-agent
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teams-chat-agent
spec:
  ingressClassName: YOUR_INGRESS_CLASS
  tls:
    - hosts: ["agent.example.com"]
      secretName: teams-chat-agent-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /api/messages
            pathType: Exact
            backend:
              service:
                name: teams-chat-agent
                port:
                  number: 80